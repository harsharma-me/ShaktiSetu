<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShaktiSetu Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="login-overlay">
        <div class="login-card">
            <h2>Admin Login</h2>
            <p>ShaktiSetu Central Control</p>
            <input type="email" id="login-email" placeholder="Admin Email">
            <input type="password" id="login-password" placeholder="Password">
            <button id="btn-login" class="btn-primary">Authenticate</button>
            <p id="login-error" style="color: #ff4d4d; margin-top: 10px; display: none;"></p>
        </div>
    </div>

    <div class="sidebar" style="display: none;">
        <div class="logo">
            <span class="logo-icon">🆘</span>
            <h1>ShaktiSetu</h1>
        </div>
        <nav>
            <ul>
                <li class="active" onclick="showSection('live-sos', this)">Live Emergencies</li>
                <li onclick="showSection('users', this)">All Users</li>
                <li onclick="showSection('notifications', this)">Send Notifications</li>
                <li onclick="logout()" class="logout-btn">Logout</li>
            </ul>
        </nav>
    </div>

    <main style="display: none;">
        <header>
            <h2 id="section-title">Live SOS Monitoring</h2>
            <div class="admin-profile">
                <span id="admin-email-display">Admin Console</span>
            </div>
        </header>

        <!-- Live SOS Section -->
        <section id="live-sos" class="content-section">
            <div class="stats-bar">
                <div class="stat-card">
                    <span class="stat-label">Active Alerts</span>
                    <span id="active-alert-count" class="stat-value">0</span>
                </div>
            </div>
            <div id="sos-list" class="grid-container">
                <!-- SOS Cards will be injected here -->
                <p class="empty-msg">No active emergencies at the moment.</p>
            </div>
        </section>

        <!-- Users Section -->
        <section id="users" class="content-section" style="display:none;">
            <div class="search-bar">
                <input type="text" placeholder="Search users by email..." id="user-search">
            </div>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>User Email</th>
                        <th>UID</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="user-table-body">
                    <!-- User rows will be injected here -->
                </tbody>
            </table>
        </section>

        <!-- Notifications Section -->
        <section id="notifications" class="content-section" style="display:none;">
            <div class="form-container">
                <h3>Broadcast Notification</h3>
                <div class="form-group">
                    <label>Target Audience</label>
                    <select id="notif-target" onchange="toggleUserSelect()">
                        <option value="all">All Users</option>
                        <option value="emergency">Only Active SOS Users</option>
                        <option value="specific">Specific User</option>
                    </select>
                </div>
                <div class="form-group" id="specific-user-group" style="display:none;">
                    <label>Select User</label>
                    <select id="notif-user-select">
                        <!-- Options will be populated dynamically -->
                    </select>
                </div>
                <div class="form-group">
                    <label>Message Title</label>
                    <input type="text" id="notif-title" placeholder="e.g. Safety Alert">
                </div>
                <div class="form-group">
                    <label>Message Body</label>
                    <textarea id="notif-body" placeholder="Enter notification details..."></textarea>
                </div>
                <button class="btn-primary" onclick="sendNotification()">Send Broadcast</button>
            </div>
        </section>
    </main>

    <!-- Firebase SDKs -->
    <script type="module" src="admin.js"></script>
</body>
</html>
